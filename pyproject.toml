[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "kursove-pdf-generator"
version = "1.1.0"
description = "WMS transport course PDF generator"
requires-python = ">=3.12"
dependencies = ["Flask==3.1.3", "waitress==3.0.2", "reportlab==5.0.1", "jsonschema==4.26.0"]

[project.scripts]
kursove-pdf = "kursove_pdf.cli:main"
kursove-pdf-serve = "kursove_pdf.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kursove_pdf = ["schema.json", "fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
